name: daily-gold-rates

# Designed cadence: 08:00 IST (02:30 UTC). Second run at 20:00 IST (14:30 UTC)
# so a delayed GitHub cron cannot miss the PWA 48-hour freshness window.
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch IBJA India gold board (GoldAPI spot is fallback only)
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: python3 .github/scripts/fetch-gold-rates.py rates.json
      - name: Commit rates.json
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "chore: daily IST gold rates"
          git push
