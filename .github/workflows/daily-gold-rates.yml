name: daily-gold-rates

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GoldAPI XAU/INR
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          key = os.environ["GOLDAPI_KEY"]
          req = urllib.request.Request(
              "https://www.goldapi.io/api/XAU/INR",
              headers={"x-access-token": key, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          fetched_at = datetime.now(timezone.utc)
          ist = fetched_at.astimezone(ZoneInfo("Asia/Kolkata"))
          data["as_of_ist"] = ist.strftime("%Y-%m-%d")
          data["fetched_at_ist"] = ist.isoformat()
          data["source"] = "goldapi_inr"
          open("rates.json", "w", encoding="utf-8").write(json.dumps(data, indent=2))
          print("wrote rates.json", data.get("price_gram_22k"))
          PY
      - name: Commit rates.json
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "chore: daily IST gold rates"
          git push
